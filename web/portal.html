<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>La Camara del Portal - Digital Circus STEM Escape</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
  <link rel="stylesheet" href="css/escenario.css" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    #panel-salida {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: url("../assets/img/puerta-salida.jpeg") center/cover no-repeat;
    }
    #panel-salida[hidden] { display: none; }
    #jax-mensaje { display: none; }
    #qr-contenedor {
      background: #fff; padding: 10px; border-radius: 8px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
      margin-top: -2%;
    }
    #qr-instruccion { display: none; }
    #jax-visor {
      position: fixed; left: 8%; bottom: 5%;
      width: 280px; height: 380px;
      background: transparent; z-index: 51;
      pointer-events: none;
    }
    body.sala #control-musica { z-index: 60 !important; }
  </style>
</head>
<body class="sala">

  <div id="escena-sala">
    <model-viewer id="visor3d"
      src="../assets/modelos/portal.glb"
      camera-controls
      autoplay="false"
      ar
      shadow-intensity="1"
      exposure="1.1"
      camera-orbit="0deg 78deg 9m"
      alt="La camara del portal">
    </model-viewer>
  </div>

  <div id="vineta" aria-hidden="true"></div>

  <div id="capa-ui">
    <a href="index.html?directo=1" id="btn-volver" aria-label="Volver a las salas" title="Volver a las salas">&larr;</a>
    <div id="hud-flotante" class="visible">
      <div class="panel-hud">
        <span class="hud-etiqueta">Llaves</span>
        <div id="hud-llaves"></div>
      </div>
      <div id="rotulo-sala">
        <span class="personaje">La Camara del Portal</span>
        <span class="materia">La salida</span>
      </div>
      <div class="panel-hud" style="visibility:hidden">
        <span class="hud-etiqueta">.</span>
      </div>
    </div>

    <div id="zona-inferior">
      <p id="subtitulo-caine" aria-live="polite"></p>
      <p id="indicacion"></p>
      <div class="fila-botones">
        <button id="btn-iniciar" class="boton-carpa">Acercarse al portal</button>
      </div>
      <div id="modo-botones" hidden>
        <div class="fila-botones">
          <button id="btn-mano">Mano abierta</button>
        </div>
      </div>
    </div>
  </div>

  <div id="panel-salida" hidden>
    <model-viewer id="jax-visor"
      src="../assets/modelos/jax.glb"
      camera-controls
      disable-zoom
      camera-orbit="0deg 80deg 4m"
      alt="Jax">
    </model-viewer>
    <p id="jax-mensaje"></p>
    <div id="qr-contenedor"></div>
    <p id="qr-instruccion">Escanea la puerta de salida</p>
  </div>

  <video id="camara" autoplay muted playsinline></video>

  <script type="module">
    import { llaves, pintarHUD } from "./js/estado.js";
    import { caineDice } from "./js/audio-caine.js";
    import { iniciarGestos } from "./js/gestos.js";
    import { ANIMACIONES, TOTAL_LLAVES } from "./js/config-salas.js";
    import { sonarOurNewHome } from "./js/musica.js";

    pintarHUD();
    if (llaves().length >= TOTAL_LLAVES) sonarOurNewHome();
    const visor = document.getElementById("visor3d");
    const indicacion = document.getElementById("indicacion");
    const btnIniciar = document.getElementById("btn-iniciar");
    let abierto = false;

    function mostrarQR() {
      const panel = document.getElementById("panel-salida");
      const cont = document.getElementById("qr-contenedor");
      const urlSalida = window.location.origin + "/web/index.html?desde=portal";
      cont.innerHTML = "";
      new QRCode(cont, { text: urlSalida, width: 200, height: 200 });
      panel.hidden = false;
    }

    async function activarPortal() {
      if (abierto) return;
      if (llaves().length < TOTAL_LLAVES) {
        indicacion.textContent =
          `Te faltan ${TOTAL_LLAVES - llaves().length} llaves. Caine no abre nada gratis.`;
        return;
      }
      abierto = true;
      try {
        visor.animationName = ANIMACIONES.portal;
        visor.play({ repetitions: 1 });
      } catch {}
      indicacion.textContent = "El portal se abre...";
      document.getElementById("jax-mensaje").textContent =
        "La salida? Jajaja... claro que si, amiguito. Escanea esa puertita y te llevara a la libertad. Confia en mi, que podria salir mal?";
      mostrarQR();
      await caineDice("jax_portal");
    }

    btnIniciar.addEventListener("click", async () => {
      btnIniciar.hidden = true;
      indicacion.textContent = "Mano abierta para activar el portal";
      try {
        await iniciarGestos(document.getElementById("camara"), { manoAbierta: activarPortal });
      } catch {
        document.getElementById("modo-botones").hidden = false;
      }
    });
    document.getElementById("btn-mano").addEventListener("click", activarPortal);
  </script>
</body>
</html>
